<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHICKY</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff6e4;color:#493224;font-family:system-ui,-apple-system,sans-serif;text-align:center}header{padding:20px 12px 5px}h1{font-size:36px;margin:0;letter-spacing:2px}header p{margin:5px;color:#8d6c4d}.stats{display:flex;justify-content:center;gap:12px;margin:10px}.pill{background:white;padding:9px 15px;border-radius:30px;border:2px solid #efddbb;font-weight:700}.stage{height:min(55vh,410px);min-height:310px;max-width:700px;margin:10px auto 0;position:relative;overflow:hidden;background:#fffaf0;border-radius:25px;touch-action:manipulation}.floor{position:absolute;bottom:24px;left:15%;width:70%;height:15px;background:#f4e5c8;border-radius:50%}.chick{position:absolute;width:180px;height:270px;left:50%;top:48%;transform:translate(-50%,-50%);cursor:pointer;touch-action:manipulation;user-select:none}.chick img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.rice{position:absolute;font-size:22px;pointer-events:none;animation:fall .7s ease-out both}@keyframes fall{from{transform:translateY(-70px) rotate(-30deg);opacity:0}to{transform:translateY(0) rotate(20deg);opacity:1}}.message{min-height:30px;font-size:18px;font-weight:700;margin:12px}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:520px;margin:12px auto;padding:0 15px}button{font-size:16px;font-weight:700;border:2px solid #765139;background:#ffcf79;border-radius:18px;padding:13px 8px;color:#493224;cursor:pointer}button:active{transform:scale(.97)}small{display:block;color:#927b67;padding:10px 20px 20px}
</style></head><body><header><h1>🐥 CHICKY</h1><p>Your annoying little buddy</p></header><div class="stats"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">🌾 <span id="riceCount">0</span> 把米</div><div class="pill">👆 <span id="pokes">0</span></div></div><div class="stage" id="stage"><div class="floor"></div><div class="chick" id="chick" aria-label="点击小鸡"><img id="picture" src="assets/skinny.png" alt="CHICKY 小鸡"></div></div><div class="message" id="message">戳我试试！</div><div class="actions"><button id="feed">🌾 喂米</button><button id="scream">📢 尖叫</button><button id="poke">👆 戳戳鸡</button><button id="reset">↩️ 重新领养</button></div><small>测试版：鸡币和喂食进度保存在当前浏览器；清除浏览器数据可能丢失。</small><script>
const el=id=>document.getElementById(id),chick=el('chick'),picture=el('picture'),stage=el('stage');let coins=Number(localStorage.getItem('chickyCoins')||0),rice=Number(localStorage.getItem('chickyRice')||0),pokes=0,flight=null,leakTimer=null,busy=false,temporary=false;const images={skinny:'assets/skinny.png',normal:'assets/normal.png',balloon:'assets/balloon.png',full:'assets/full.png',scream:'assets/scream.png'};
function update(){el('coins').textContent=coins;el('riceCount').textContent=rice;el('pokes').textContent=pokes;localStorage.setItem('chickyCoins',coins);localStorage.setItem('chickyRice',rice)}function base(){return rice>=8?'full':rice>=3?'normal':'skinny'}function show(s){picture.src=images[s]}function pose(x=0,y=0,scale=1,rotate=0){return `translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) rotate(${rotate}deg) scale(${scale})`}function restore(){temporary=false;busy=false;pokes=0;chick.style.transform=pose();show(base());el('message').textContent='又来？我真的会生气！';update()}function leak(){if(busy)return;busy=true;temporary=true;show('balloon');el('message').textContent='啊啊啊！漏气啦！！💨';const size=1+Math.min(pokes,16)*.09;flight=chick.animate([{transform:pose(0,0,size)},{transform:pose(-80,-75,size*.8,100)},{transform:pose(95,-105,size*.65,260)},{transform:pose(-65,70,1.1,430)},{transform:pose(45,90,.8,620)},{transform:pose(0,0,1,720)}],{duration:2400,easing:'ease-in-out',fill:'forwards'});flight.onfinish=()=>{flight.cancel();flight=null;restore()}}
function poke(){if(busy)return;clearTimeout(leakTimer);temporary=true;pokes++;show(pokes>=6?'balloon':base());chick.style.transform=pose(0,0,1+Math.min(pokes,16)*.09);el('message').textContent=pokes>=6?'我要变成气球了！！🎈':'别戳啦！！';if(pokes%5===0)coins+=2;update();leakTimer=setTimeout(leak,1000)}chick.addEventListener('pointerdown',poke);el('poke').onclick=poke;
el('feed').onclick=()=>{if(busy||temporary)return;rice++;coins+=1;update();for(let i=0;i<8;i++){const grain=document.createElement('span');grain.className='rice';grain.textContent='·';grain.style.left=(25+Math.random()*50)+'%';grain.style.top=(68+Math.random()*16)+'%';stage.appendChild(grain);setTimeout(()=>grain.remove(),1700)}show(base());el('message').textContent=rice>=8?'吃不下啦！肚子要爆炸了！':rice>=3?'嗯？我好像胖了一点！':'好吃！再来一把！'};
function sound(){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const start=ctx.currentTime;for(let i=0;i<5;i++){let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sawtooth';osc.frequency.setValueAtTime(550+i*100,start+i*.13);osc.frequency.exponentialRampToValueAtTime(260,start+i*.13+.11);gain.gain.setValueAtTime(.0001,start+i*.13);gain.gain.exponentialRampToValueAtTime(.12,start+i*.13+.02);gain.gain.exponentialRampToValueAtTime(.0001,start+i*.13+.12);osc.connect(gain).connect(ctx.destination);osc.start(start+i*.13);osc.stop(start+i*.13+.13)}setTimeout(()=>ctx.close(),1200)}catch(e){}}
el('scream').onclick=()=>{if(busy)return;clearTimeout(leakTimer);busy=true;temporary=true;show('scream');chick.style.transform=pose(0,0,1.15);el('message').textContent='AAAAAAAAAAAA!!!';sound();setTimeout(()=>{chick.style.transform=pose();restore()},1000)};
el('reset').onclick=()=>{clearTimeout(leakTimer);if(flight){flight.cancel();flight=null}rice=0;coins=0;restore();el('message').textContent='一只新的瘦鸡诞生啦！'};show(base());update();
</script></body></html>
