<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CHICKY 4.0 走路动画测试</title><style>body{margin:0;background:#fff7e9;color:#563923;font-family:system-ui;text-align:center}main{max-width:650px;margin:auto;padding:20px}h1{margin:12px}#stage{position:relative;height:380px;overflow:hidden;border:3px solid #a87b51;border-radius:20px;background:#fff;display:flex;align-items:center;justify-content:center}#chick{width:260px;height:374px;object-fit:contain;transition:transform .12s}#chick.paused{filter:grayscale(.25)}button{border:0;border-radius:20px;padding:13px 20px;margin:12px 4px;background:#ffcf60;font-size:17px;font-weight:700;color:#573a22}small{display:block;line-height:1.6;color:#80664e}</style><main><h1>🐥 CHICKY 4.0</h1><p>第一组走路动画测试</p><div id="stage"><img id="chick" src="Animations/walk-01.png" alt="CHICKY"></div><div><button id="toggle">暂停</button><button id="speed">加速 ×2</button></div><p id="info">第 1 / 8 帧</p><small>这是从设计稿裁切的动作预览。原图的棋盘格是绘制在图片中的，并非真正透明背景；正式游戏版仍需清理素材、统一角色位置。</small></main><script>const chick=document.querySelector('#chick'),info=document.querySelector('#info'),toggle=document.querySelector('#toggle'),speed=document.querySelector('#speed');let i=0,playing=true,fast=false;const frames=Array.from({length:8},(_,i)=>'Animations/walk-'+String(i+1).padStart(2,'0')+'.png');frames.forEach(src=>{const im=new Image();im.src=src});let last=0;function tick(t){if(playing&&t-last>(fast?95:185)){last=t;i=(i+1)%8;chick.src=frames[i];info.textContent='第 '+(i+1)+' / 8 帧';}requestAnimationFrame(tick)}requestAnimationFrame(tick);toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'暂停':'继续'};speed.onclick=()=>{fast=!fast;speed.textContent=fast?'恢复正常速度':'加速 ×2'}</script></html>
